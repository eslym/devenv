name: Build PHP version matrix

on:
  workflow_dispatch:

jobs:
  dispatch-builds:
    name: Dispatch PHP builds
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger image build workflow for each PHP version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          for version in 8.2.36 8.3.37 8.4.28 8.5.13; do
            gh workflow run build.yaml --ref "$REF" --field "php-version=$version"
          done
